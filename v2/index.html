<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ミューの今日の運勢ガチャ</title>
<style>
:root{
  --ink:#0d0b26; --deep:#141033; --cream:#f6efdd; --gold:#d9a441; --gold2:#ffe9a8;
  --violet:#8f7ff5; --muted:#b9b3d9; --card:rgba(24,20,54,.88); --line:rgba(217,164,65,.45);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
  background:radial-gradient(120% 90% at 50% 0%, #241a4d 0%, var(--ink) 55%, #07061a 100%);
  color:var(--cream); min-height:100vh;
}
#stars{position:fixed;inset:0;z-index:0;pointer-events:none}
.nebula{position:fixed;inset:-20%;z-index:0;pointer-events:none;opacity:.5;
  background:radial-gradient(40% 30% at 25% 20%, rgba(112,80,220,.35), transparent 70%),
             radial-gradient(35% 28% at 78% 30%, rgba(64,120,220,.28), transparent 70%),
             radial-gradient(30% 24% at 55% 75%, rgba(190,90,200,.20), transparent 70%);
  animation:drift 46s ease-in-out infinite alternate}
@keyframes drift{from{transform:translate(-2%,-1%)}to{transform:translate(2%,2%)}}
.app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:14px 14px 30px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 2px 12px}
.brand{font-family:"Hiragino Mincho ProN",serif;font-size:15px;letter-spacing:.04em;flex:1;min-width:0}
.brand .moon{color:var(--gold2)}
.topbtns{display:flex;gap:6px;flex:none}
button{font:inherit;cursor:pointer}
.ghost{background:rgba(20,16,51,.6);color:var(--cream);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;white-space:nowrap}
.ghost.wide{width:100%;margin-top:8px}
.primary{background:linear-gradient(180deg,#ffdf8e,#d9a441);color:#241a05;border:none;border-radius:999px;padding:12px 22px;font-weight:700;font-size:15px;width:100%}
.primary:active{transform:scale(.98)}
.foot{margin-top:26px;font-size:11px;color:var(--muted);text-align:center;line-height:1.7}
h2.title{font-family:"Hiragino Mincho ProN",serif;font-weight:600;font-size:20px;margin:8px 0 4px;text-align:center}
p.lead{text-align:center;color:var(--muted);font-size:13px;margin:0 0 14px}
.date{text-align:center;color:var(--gold2);font-size:13px;letter-spacing:.14em;margin-top:2px}

/* 選択（タロット/石） */
.choiceWrap{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:#000}
.choiceWrap>img.bg{width:100%;height:300px;object-fit:cover;display:block;filter:brightness(.9)}
.candRow{position:absolute;inset:auto 0 0 0;display:flex;gap:10px;justify-content:center;padding:12px;background:linear-gradient(180deg,transparent,rgba(5,4,20,.88) 40%)}
.cand{flex:1;max-width:130px;background:rgba(16,12,44,.85);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;color:var(--cream);transition:transform .15s, box-shadow .15s}
.cand:active{transform:scale(.96)}
.cand .num{font-family:"Hiragino Mincho ProN",serif;font-size:22px;color:var(--gold2)}
.cand .cname{font-size:14px;margin-top:2px}
.cand .fname{font-size:11px;color:var(--muted)}
.cand .shape{font-size:10px;color:var(--muted);margin-top:2px}
.cand.picked{box-shadow:0 0 0 2px var(--gold2),0 0 34px rgba(255,220,130,.8)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px;border:1px solid rgba(255,255,255,.5)}
.beam{position:absolute;left:50%;top:0;bottom:0;width:90px;transform:translateX(-50%);pointer-events:none;opacity:0;
  background:linear-gradient(180deg,rgba(255,240,190,0),rgba(255,240,190,.85),rgba(255,240,190,0))}
.beam.on{animation:beamA 1s ease-out}
@keyframes beamA{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
.bigbtn{display:block;margin:14px auto 0}

/* カード一覧 */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.fcard{position:relative;height:172px;perspective:900px;background:none;border:none;padding:0;text-align:left;width:100%}
.fcard .inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.2,.7,.3,1.2)}
.fcard.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:14px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:1px solid var(--line);display:block}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.face::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,4,20,.04) 42%,rgba(5,4,20,.86));z-index:1}
.face .info{position:absolute;left:0;right:0;bottom:9px;z-index:2;text-align:center;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.face .type{font-size:11px;letter-spacing:.18em;color:var(--gold2);display:block}
.face .head{font-family:"Hiragino Mincho ProN",serif;font-size:16px;font-weight:700;color:var(--cream);display:block;margin-top:2px}
.face .head.long{font-size:13px}
.face .tap{font-size:10px;color:var(--muted);display:block;margin-top:2px}
.face.front{transform:rotateY(180deg)}
.fcard.spark-gold .face.back{box-shadow:0 0 0 2px var(--gold),0 0 26px rgba(255,205,90,.75)}
.fcard.spark-rainbow .face.back{box-shadow:0 0 0 2px var(--gold),0 0 26px rgba(255,205,90,.75)}
.fcard.spark-rainbow.flipped .face.front{box-shadow:0 0 0 2px #fff,0 0 32px rgba(160,220,255,.9)}
.fcard .glow{position:absolute;inset:-6px;border-radius:16px;pointer-events:none;opacity:0;z-index:3}
.fcard.spark-gold .glow{background:radial-gradient(50% 50% at 50% 50%,rgba(255,220,130,.35),transparent 70%);opacity:1;animation:pulse 2.2s ease-in-out infinite}
.fcard.spark-rainbow .glow{background:radial-gradient(50% 50% at 50% 50%,rgba(255,220,130,.35),transparent 70%);opacity:1;animation:pulse 1.8s ease-in-out infinite}
.fcard.spark-rainbow.flipped .glow{background:radial-gradient(50% 50% at 50% 50%,rgba(190,220,255,.4),transparent 70%)}
@keyframes pulse{0%,100%{transform:scale(.96)}50%{transform:scale(1.05)}}

/* 詳細 */
.hero{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.hero img{width:100%;height:300px;object-fit:cover;display:block}
.hero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,4,20,.05) 40%,rgba(5,4,20,.9))}
.hero .hinfo{position:absolute;left:0;right:0;bottom:14px;text-align:center;z-index:2;padding:0 12px}
.hero .type{font-size:12px;letter-spacing:.2em;color:var(--gold2)}
.hero .head{font-family:"Hiragino Mincho ProN",serif;font-size:30px;font-weight:700;margin-top:4px;text-shadow:0 2px 14px rgba(0,0,0,.8)}
.hero .sub{font-size:13px;color:var(--cream);margin-top:4px}
.sections{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.sect{background:var(--card);border:1px solid rgba(217,164,65,.28);border-radius:14px;padding:12px 14px}
.sect h3{margin:0 0 6px;font-size:13px;letter-spacing:.08em;color:var(--gold2);font-weight:700}
.sect p{margin:0;font-size:14.5px;line-height:1.85;white-space:pre-wrap}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:rgba(10,8,32,.55);border:1px solid rgba(217,164,65,.2);border-radius:10px;padding:8px 10px}
.tile .k{font-size:11px;color:var(--gold2);letter-spacing:.1em}
.tile .v{font-size:12.5px;line-height:1.7;margin-top:3px}
.ptable{width:100%;border-collapse:collapse;font-size:14px}
.ptable td,.ptable th{border:1px solid rgba(217,164,65,.25);padding:7px 9px;text-align:center}
.ptable th{color:var(--gold2);font-weight:600;background:rgba(10,8,32,.5)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:flex;align-items:center;gap:9px;font-size:13px}
.bar .el{width:1.4em;color:var(--gold2)}
.bar .track{flex:1;height:9px;background:rgba(255,255,255,.09);border-radius:99px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,#8f7ff5,#d9a441)}
.actions{display:flex;gap:8px;margin-top:14px}
.actions .ghost{flex:1;padding:11px 8px}
.backrow{margin-top:16px;text-align:center}

/* 履歴・設定 */
.hrow{background:var(--card);border:1px solid rgba(217,164,65,.28);border-radius:14px;padding:12px 14px;margin-top:10px}
.hrow .d{color:var(--gold2);font-size:13px;letter-spacing:.08em}
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hchip{background:rgba(10,8,32,.6);border:1px solid var(--line);color:var(--cream);border-radius:999px;padding:6px 11px;font-size:12.5px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid rgba(217,164,65,.28);border-radius:14px;padding:13px 14px;margin-top:10px;font-size:14.5px}
.setrow small{display:block;color:var(--muted);font-size:12px;margin-top:3px;line-height:1.6}
.switch{position:relative;width:48px;height:27px;flex:none}
.switch input{opacity:0;width:100%;height:100%;position:absolute;margin:0;cursor:pointer;z-index:2}
.switch .tr{position:absolute;inset:0;background:rgba(255,255,255,.14);border-radius:99px;transition:.2s}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked + .tr{background:var(--gold)}
.switch input:checked + .tr::after{left:24px}
.empty{color:var(--muted);text-align:center;padding:26px 0;font-size:14px}

/* モーダル */
.modal{position:fixed;inset:0;z-index:10;background:rgba(4,3,16,.72);display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.modalcard{background:#1a1542;border:1px solid var(--line);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:92vh;overflow:auto;padding:20px 18px 26px}
.modalcard h2{font-family:"Hiragino Mincho ProN",serif;font-size:18px;margin:0 0 8px}
.modalcard .note{font-size:12.5px;color:var(--muted);line-height:1.75}
.modalcard label{display:block;font-size:13.5px;margin-top:14px}
.modalcard input,.modalcard select{width:100%;margin-top:6px;background:#0d0b26;color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:16px}
.modalcard .primary{margin-top:18px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:rgba(10,8,32,.94);border:1px solid var(--gold);color:var(--cream);padding:10px 18px;border-radius:999px;font-size:13.5px;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.on{opacity:1}

</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="nebula"></div>
<div class="app">
  <header class="topbar">
    <div class="brand"><span class="moon">☽</span> ミューの今日の運勢ガチャ</div>
    <div class="topbtns">
      <button id="btnHistory" class="ghost">履歴</button>
      <button id="btnSettings" class="ghost">設定</button>
    </div>
  </header>

  <main id="view"></main>
  <footer class="foot">結果は今日の分として固定されます ／ 生年月日そのものは保存せず、占いに使うコードだけを端末内に保存します</footer>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modalcard">
    <h2>初回登録 ― 占い用プロフィール</h2>
    <p class="note">四柱推命と星座のために生年月日を聞きます。生年月日そのものは保存しません。保存するのは占いに使うコード（星座・干支など）で、この端末の中だけに置き、外には送りません。</p>
    <form id="profileForm">
      <label>生年月日（必須）
        <input type="date" id="fBirth" required min="1920-01-01" max="2100-12-31">
      </label>
      <label>血液型（任意）
        <select id="fBlood">
          <option value="">選択しない（任意）</option>
          <option>A</option><option>B</option><option>O</option><option>AB</option><option>不明</option>
        </select>
      </label>
      <label>性別（任意）
        <select id="fGender">
          <option value="">選択しない（任意）</option>
          <option>女性</option><option>男性</option><option>指定しない</option>
        </select>
      </label>
      <p class="note">※四柱推命は生まれた時間を使わない三柱（年・月・日）で読みます。</p>
      <button type="submit" class="primary">登録してはじめる</button>
      <button type="button" id="modalClose" class="ghost wide">閉じる</button>
    </form>
  </div>
</div>

      sec('仕事運 ' + starStr(starsFor(ov - 1)), pickFresh(rng, D.work[band], 'zo:work:' + band, used, today).text),
      sec('ラッキーカラー', pickFresh(rng, D.luckyColor, 'zo:luckyColor', used, today).text),
      sec('ラッキーアイテム', pickFresh(rng, D.luckyItem, 'zo:luckyItem', used, today).text),
      sec('ラッキーフード', pickFresh(rng, D.luckyFood, 'zo:luckyFood', used, today).text),
      sec('ラッキープレイス', pickFresh(rng, D.luckyPlace, 'zo:luckyPlace', used, today).text)
    ];
    return { type: '星座占い', key: 'zodiac', head: sign.name + ' 第' + rank + '位', spark: rank <= 3 ? 'gold' : '', sections: sections, sub: sign.period + ' ／ ' + sign.trait };
  }

  function genShichu(rng, used, today, profile) {
    var D = global.DATA_SHICHU;
    var pil = { year: profile.pil.y, month: profile.pil.m, day: profile.pil.d };
    var g = gogyo(pil);
    var dm = D.dayMaster[pil.day[0]];
    var sections = [];
    sections.push({ h: '命式', pillars: [
      ['年柱', pillarName(pil.year), tenGod(pil.day[0], pil.year[0])],
      ['月柱', pillarName(pil.month), tenGod(pil.day[0], pil.month[0])],
      ['日柱', pillarName(pil.day), '日主']
    ] });
    var td = today.split('-');
    var tPil = pillars(parseInt(td[0], 10), parseInt(td[1], 10), parseInt(td[2], 10));
    var god = tenGod(pil.day[0], tPil.day[0]);
    sections.push(sec('今日の通変星 ― ' + god, pickFresh(rng, D.todayGod[god], 'sh:god:' + god, used, today).text));
    sections.push(sec('日主 ― ' + dm.s + '（' + dm.el + '・' + dm.image + '）', dm.nature));
    sections.push(sec('今日の活かし方', pickFresh(rng, dm.today, 'sh:today:' + pil.day[0], used, today).text));
    sections.push({ h: '五行バランス', bars: [['木', g.count['木']], ['火', g.count['火']], ['土', g.count['土']], ['金', g.count['金']], ['水', g.count['水']]] });
    if (g.richList && g.richList.length > 1) sections.push(sec('満ちている気', g.richList.join('・') + 'の気がそろって満ちています。同点の気が支え合う、巡りのよい配置です。'));
    else sections.push(sec('満ちている気', pickFresh(rng, D.richest[g.richest], 'sh:rich:' + g.richest, used, today).text));
    if (g.lackList && g.lackList.length > 1) sections.push(sec('補いたい気', g.lackList.join('・') + 'の気が控えめです。' + pickFresh(rng, D.lacking[g.lackList[0]], 'sh:lack:' + g.lackList[0], used, today).text));
    else sections.push(sec('補いたい気', pickFresh(rng, D.lacking[g.lacking], 'sh:lack:' + g.lacking, used, today).text));
    var st = stage12(pil.day[0], pil.month[1]);
    sections.push(sec('十二運 ― ' + st, D.unsei12[st]));
    sections.push(sec('総合', pickFresh(rng, D.fields.overall[g.strength], 'sh:f:overall:' + g.strength, used, today).text));
    sections.push(sec('恋愛', pickFresh(rng, D.fields.love[g.strength], 'sh:f:love:' + g.strength, used, today).text));
    sections.push(sec('金運', pickFresh(rng, D.fields.money[g.strength], 'sh:f:money:' + g.strength, used, today).text));
    sections.push(sec('仕事', pickFresh(rng, D.fields.work[g.strength], 'sh:f:work:' + g.strength, used, today).text));
    return { type: '四柱推命', key: 'shichu', head: '日主は' + dm.s, spark: '', sections: sections, sub: '命式 ' + pillarName(pil.year) + '・' + pillarName(pil.month) + '・' + pillarName(pil.day) };
  }

  function genColor(rng, used, today, masterIdx) {
    var D = global.DATA_COLOR;
    var M = MASTER[masterIdx];
    var shade = M[3][pickFreshIdx(rng, M[3].length, 'co:shade:' + masterIdx, used, today)];
    var R = D.reads[masterIdx];
    var sections = [
      sec('今日の色', shade + ' ― ' + M[1] + 'の系統から、今日のあなたに届いた色です。'),
      sec('表の顔（顕在意識）', pickFresh(rng, R.surface, 'co:surface:' + masterIdx, used, today).text),
      sec('奥の気持ち（潜在意識）', pickFresh(rng, R.deep, 'co:deep:' + masterIdx, used, today).text),
      sec('色を取り入れる行動', pickFresh(rng, R.action, 'co:action:' + masterIdx, used, today).text)
    ];
    return { type: '色占い', key: 'color', head: shade, spark: rng() < 0.3 ? 'gold' : '', sections: sections, sub: '選んだ色の系統：' + M[1] };
  }

  function genFlower(rng, used, today, masterIdx) {
    var D = global.DATA_FLOWER;
    var M = MASTER[masterIdx];
    var entries = [];
    for (var i = 0; i < D.lang.length; i++) if (D.lang[i].flower === M[2]) entries.push(D.lang[i]);
    var ADJ = { '赤色': '赤い', '白色': '白い', '黄色': '黄色い', '黒色': '黒い', '青色': '青い', '桃色': 'ピンクの', '水色': '水色の', '橙色': 'オレンジ色の', '紫色': '紫の', '紅色': '紅色の', '紅紫色': '赤紫の', '茶色': '茶色の' };
    var ei = entries.length ? pickFreshIdx(rng, entries.length, 'fl:entry:' + masterIdx, used, today) : -1;
    var e = ei >= 0 ? entries[ei] : { shade: '', word: '' };
    var dispShade = e.shade ? ((ADJ[e.shade] || (e.shade.replace(/色$/, '') + 'の')) + M[2]) : M[2];
    var cw = (D.colorWord || {})[M[2] + '|' + e.shade];
    var word = cw || pickFresh(rng, (D.flowerWords || {})[M[2]] || [e.word], 'fl:word:' + masterIdx, used, today).text;
    var R = D.reads[masterIdx];
    var sections = [
      sec('今日の花', dispShade + '（花言葉：' + word + '）'),
      sec('キャッチコピー', pickFresh(rng, R.catch, 'fl:catch:' + masterIdx, used, today).text),
      sec('今日のあなた', pickFresh(rng, R.persona, 'fl:persona:' + masterIdx, used, today).text),
      sec('今日の行動', pickFresh(rng, R.action, 'fl:action:' + masterIdx, used, today).text),
      sec('花の豆知識', R.trivia[0])
    ];
    return { type: '花占い', key: 'flower', head: dispShade, spark: rng() < 0.3 ? 'gold' : '', sections: sections, sub: '模様の花：' + M[2] };
  }

  function genNumber(rng, used, today, masterIdx) {
    var D = global.DATA_NUMBER;
    var n = masterIdx + 1;
    var set, note = '';
    if (n <= 9) set = D.fixed[n];
    else {
      var idx = pickFreshIdx(rng, D.pool.length, 'nu:pool', used, today);
      set = D.pool[idx];
      note = '※10〜15の数字は、日ごとに変わる読みから選んでいます。';
    }
    var sections = [
      sec('キーワード', set.kw),
      sec('光の面', set.light),
      sec('影の面', set.shadow),
      sec('今日の助言', set.advice),
      sec('ラッキーカラー', set.color),
      sec('ラッキーアイテム', set.item)
    ];
    if (note) sections.push(sec('注記', note));
    return { type: '数字占い', key: 'number', head: '数字は ' + n, spark: rng() < 0.3 ? 'gold' : '', sections: sections, sub: '選んだ数字：' + MASTER[masterIdx][0] };
  }

  function genTarot(rng, used, today) {
    var D = global.DATA_TAROT;
    var card = D.cards[pickFreshIdx(rng, D.cards.length, 'ta:card', used, today)];
    var up = rng() < 0.65;
    var face = up ? card.up : card.rev;
    var gk = ['恋愛', '仕事', '金運'];
    var sections = [
      sec('カードの意味', face.text),
      sec('キーワード', face.kw)
    ];
    for (var i = 0; i < gk.length; i++) {
      sections.push(sec(gk[i], pickFresh(rng, D.genre[gk[i]][up ? 'up' : 'rev'], 'ta:' + gk[i] + ':' + (up ? 'up' : 'rev'), used, today).text));
    }
    return { type: 'タロット風', key: 'tarot', head: card.name + '（' + (up ? '正位置' : '逆位置') + '）', spark: up ? 'gold' : '', sections: sections };
  }

  function genMuse(rng, used, today, forceRainbow) {
    var D = global.DATA_MUSE;
    var rainbow = forceRainbow || rng() < 0.18;
    var src, head, sub, cat, spark;
    if (rainbow) {
      src = D.rainbow[pickFreshIdx(rng, D.rainbow.length, 'mu:src:rainbow', used, today)]; head = 'レインボー大吉';
      var mm = /（(.+?)がマックス/.exec(src.sub);
      sub = src.sub.split('（')[0] + (mm ? ' ― ' + mm[1] + ' MAX' : ''); cat = src.cat; spark = 'rainbow';
    } else {
      src = D.yoshi[pickFreshIdx(rng, D.yoshi.length, 'mu:src:yoshi', used, today)]; head = src.name; sub = src.theme; cat = src.cat; spark = 'gold';
    }
    var B = D.blocks[cat];
    var sections = [
      sec('総評', pickFresh(rng, src.total, 'mu:total:' + (rainbow ? 'rb' : 'yo') + ':' + (rainbow ? D.rainbow.indexOf(src) : D.yoshi.indexOf(src)), used, today).text),
      sec('今日のひとこと', pickFresh(rng, src.hitokoto, 'mu:hito:' + (rainbow ? 'rb' : 'yo') + ':' + (rainbow ? D.rainbow.indexOf(src) : D.yoshi.indexOf(src)), used, today).text),
      sec('今日のミッション', pickFresh(rng, B.mission, 'mu:mission:' + cat, used, today).text),
      sec('助言', pickFresh(rng, B.advice, 'mu:advice:' + cat, used, today).text),
      sec('気をつけたいこと', pickFresh(rng, B.caution, 'mu:caution:' + cat, used, today).text),
      sec('味方ポイント', pickFresh(rng, B.ally, 'mu:ally:' + cat, used, today).text),
      sec('明日の種まき', pickFresh(rng, B.seed, 'mu:seed:' + cat, used, today).text)
    ];
    return { type: 'ミューズ占い', key: 'muse', head: head, spark: spark, sections: sections, sub: sub, rainbow: rainbow };
  }

  var GEN = { omikuji: genOmikuji, zodiac: genZodiac, shichu: genShichu, color: genColor, flower: genFlower, number: genNumber, tarot: genTarot, muse: genMuse };

  // 1日分の全結果を生成（choice = マスターindex、forceRainbow = ミューズ干上がり救済）
  function generateAll(today, profile, choice, used, forceRainbow) {
    var out = {};
    for (var i = 0; i < TYPES.length; i++) {
      var k = TYPES[i].key;
      var rng = rngFrom(today + '|' + profile.sig + '|' + choice + '|' + k);
      COLLECT = [];
      if (k === 'zodiac' || k === 'shichu') out[k] = GEN[k](rng, used, today, profile);
      else if (k === 'color' || k === 'flower' || k === 'number') out[k] = GEN[k](rng, used, today, choice);
      else if (k === 'muse') out[k] = GEN[k](rng, used, today, forceRainbow);
      else out[k] = GEN[k](rng, used, today);
      out[k]._ids = COLLECT; COLLECT = null;
    }
    return out;
  }
  function generateOne(today, profile, choice, used, key, forceRainbow) {
    var rng = rngFrom(today + '|' + profile.sig + '|' + choice + '|' + key);
    COLLECT = [];
    var res;
    if (key === 'zodiac' || key === 'shichu') res = GEN[key](rng, used, today, profile);
    else if (key === 'color' || key === 'flower' || key === 'number') res = GEN[key](rng, used, today, choice);
    else if (key === 'muse') res = GEN[key](rng, used, today, forceRainbow);
    else res = GEN[key](rng, used, today);
    res._ids = COLLECT; COLLECT = null;
    return res;
  }

  // 今日の候補3つと媒体（タロット/石）を決める
  function daySetup(today, profile) {
    var rng = rngFrom(today + '|' + profile.sig + '|setup');
    var medium = rng() < 0.5 ? 'tarot' : 'stone';
    var idxs = [];
    while (idxs.length < 3) { var v = Math.floor(rng() * 15); if (idxs.indexOf(v) < 0) idxs.push(v); }
    var order = TYPES.map(function (t) { return t.key; });
    for (var i = order.length - 1; i > 0; i--) { var j = Math.floor(rng() * (i + 1)); var t2 = order[i]; order[i] = order[j]; order[j] = t2; }
    return { medium: medium, cand: idxs, order: order };
  }

  global.FG = {
    STEMS: STEMS, BRANCHES: BRANCHES, MASTER: MASTER, TYPES: TYPES,
    pillars: pillars, pillarName: pillarName, tenGod: tenGod, stage12: stage12, gogyo: gogyo,
    zodiacSign: zodiacSign, buildProfile: buildProfile, daySetup: daySetup,
    generateAll: generateAll, generateOne: generateOne, rngFrom: rngFrom
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = global.FG;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
'use strict';
/* 運勢ガチャ v2 本体UI
- 日付は端末の現地時間 0:00 で切り替え、その日の結果は固定（引き直し不可）
- プロフィールは換算コードのみ保存。文面は直近30日かぶり防止
- ミューズ占い：レインボー大吉は18%、引いた回数で5回出なければ次に必ず出る（初回は必ず虹） */
(function () {
var LS = {
get: function (k, d) { try { var v = localStorage.getItem('mfg2_' + k); return v? JSON.parse(v): d;} catch (e) { return d;}},
set: function (k, v) { try { localStorage.setItem('mfg2_' + k, JSON.stringify(v));} catch (e) {}}
};
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');}
function esc(s) { return String(s == null? '': s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c];});}
function A(name) { return (window.__ASSETS && window.__ASSETS[name]) || ('assets/' + name); }
var view = document.getElementById('view');
var TODAY = todayStr();

var profile = LS.get('profile', null);
if (profile && profile.y) { var nowAge = new Date().getFullYear() - profile.y; profile.ageBand = nowAge < 20? '10代': (Math.floor(nowAge / 10) * 10) + '代';}
var settings = LS.get('settings', { omakase: false, sound: true});
var day = LS.get('day', null);
var used = LS.get('used', {});
var history = LS.get('history', {});

// 日付が変わっていたら、保留中の新プロフィールを適用
var pending = LS.get('profile_next', null);
if (pending && (!day || day.date!== TODAY)) { profile = pending; LS.set('profile', profile); LS.set('profile_next', null); pending = null;}
if (!day || day.date!== TODAY || (profile && day.sig!== profile.sig)) {
day = { date: TODAY, sig: profile? profile.sig: '', setup: null, choice: null, results: null, flipped: [], omakase: null};
if (profile) { day.setup = FG.daySetup(TODAY, profile); maybeOmakase();}
LS.set('day', day);
}
function saveDay() { LS.set('day', day);}
function saveUsed() {
var now = Date.now();
for (var k in used) { if (now - new Date(used[k] + 'T00:00:00').getTime() > 60 * 86400000) delete used[k];}
LS.set('used', used);
}

// レインボー大吉の干上がり救済判定
function museForce() {
var t = LS.get('muse_track', null);
if (!t || !t.seen) return true; // 初回は必ず虹（体験保証）。以後は暦ではなく「引いた回数」で判定
return (t.since || 0) >= 5;
}
function noteMuse(result) {
if (!result) return;
var t = LS.get('muse_track', { seen: false, since: 0});
t.seen = true;
t.since = result.rainbow? 0: (t.since || 0) + 1;
LS.set('muse_track', t);
if (result.rainbow) LS.set('muse_last_rainbow', TODAY);
}
function commitIds(res) {
if (!res || !res._ids) return;
var dirty = false;
res._ids.forEach(function (id) { if (!used[id]) { used[id] = TODAY; dirty = true;}});
if (dirty) saveUsed();
}
function heroStyle(key) { return key === 'muse'? ' style="object-position:center 12%"': '';}

function maybeOmakase() {
if (!settings.omakase ||!profile || day.omakase || day.choice!== null) return;
var rng = FG.rngFrom(TODAY + '|' + profile.sig + '|omakase');
var choice = day.setup.cand[Math.floor(rng() * 3)];
var keys = FG.TYPES.map(function (t) { return t.key;});
var type = keys[Math.floor(rng() * keys.length)];
var res = FG.generateOne(TODAY, profile, choice, Object.assign({}, used), type, museForce());
commitIds(res);
if (type === 'muse') {
if (!(LS.get('muse_track', { seen: false}).seen) && res.rainbow) res.sub = (res.sub || '') + ' ／ はじめての方へ、特別な一枚です';
noteMuse(res);
}
day.choice = choice; day.omakase = { type: type};
day.results = {}; day.results[type] = res; day.flipped = [type];
pushHistory(type, res);
saveUsed();
}
function pushHistory(key, res) {
if (!history[TODAY]) history[TODAY] = {};
var snap = Object.assign({}, res); delete snap._ids;
history[TODAY][key] = snap;
LS.set('history', history);
}

// ---------- 音（Web Audio合成） ----------
var AC = null;
function tone(f, t, d, type) {
if (!settings.sound) return;
try {
if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
var o = AC.createOscillator(), g = AC.createGain();
o.type = type || 'sine'; o.frequency.value = f;
var s = AC.currentTime + t;
g.gain.setValueAtTime(0.0001, s);
g.gain.exponentialRampToValueAtTime(0.12, s + 0.02);
g.gain.exponentialRampToValueAtTime(0.0001, s + d);
o.connect(g); g.connect(AC.destination); o.start(s); o.stop(s + d + 0.05);
} catch (e) {}
}
function sndPick() { tone(880, 0, 0.25); tone(1318, 0.09, 0.35);}
function sndFlip() { tone(660, 0, 0.18);}
function sndRainbow() { [523, 659, 784, 1046, 1318].forEach(function (f, i) { tone(f, i * 0.08, 0.4, 'triangle');});}
function sndGold() { [784, 988, 1174].forEach(function (f, i) { tone(f, i * 0.07, 0.3, 'triangle');});}

function toast(msg) {
var t = document.querySelector('.toast');
if (!t) { t = document.createElement('div'); t.className = 'toast'; document.body.appendChild(t);}
t.textContent = msg; t.classList.add('on');
setTimeout(function () { t.classList.remove('on');}, 2200);
}

// ---------- 画面：トップ＝選択 ----------
var COLOR_DOT = { '赤': '#d23c2e', '橙': '#e8862e', '黄': '#e5c02e', '黄緑': '#9bc53d', '緑': '#3d9b50', '青緑': '#2eb8a6', '水色': '#6fc3e7', '青': '#3d6fd1', '紫': '#8a5fc0', '桃': '#f2a0b5', '紅紫': '#c04a8a', '茶': '#9b6b43', '白': '#f2f0e8', '灰': '#a8a8b0', '黒': '#3a3a44'};
function renderTop() {
var html = '<p class="date">' + TODAY.replace(/-/g, '/') + '</p>';
if (!profile) {
html += '<h2 class="title">今日の運勢を占います</h2><p class="lead">最初に一度だけ、占い用プロフィールの登録をお願いします。</p>' +
'<button class="primary bigbtn" id="goRegister">プロフィールを登録する</button>';
view.innerHTML = html;
document.getElementById('goRegister').onclick = openModal;
return;
}
if (day.omakase) {
var r = day.results[day.omakase.type];
html += '<h2 class="title">今日のおまかせ一占</h2><p class="lead">選ぶ手間なく、今日のひとつが届きました。</p>' +
'<div class="hero"><img src="' + A('front-' + r.key + '.webp') + '" alt=""' + heroStyle(r.key) + '><div class="shade"></div>' +
'<div class="hinfo"><span class="type">' + esc(r.type) + '</span><div class="head">' + esc(r.head) + '</div></div></div>' +
'<button class="primary bigbtn" id="goDetail">結果を見る</button>';
view.innerHTML = html;
document.getElementById('goDetail').onclick = function () { renderDetail(r, 'top');};
return;
}
if (day.choice!== null && day.results) {
html += '<h2 class="title">今日の運勢は決まっています</h2><p class="lead">「あなたの選択により今日の運勢が導かれました」</p>' +
'<button class="primary bigbtn" id="goCards">カードを見る</button>';
view.innerHTML = html;
document.getElementById('goCards').onclick = renderCards;
return;
}
var med = day.setup.medium;
html += '<h2 class="title">直感でひとつ、選んでください</h2>' +
'<p class="lead">' + (med === 'tarot'? '今日はタロットの日。3枚のカードから1枚を。': '今日は石の日。袋の中の3つの石から1つを。') + '</p>';
html += '<div class="choiceWrap"><img class="bg" src="' + A('choice-abstract.webp') + '" alt=""><div class="beam" id="beam"></div><div class="candRow">';
day.setup.cand.forEach(function (mi) {
var M = FG.MASTER[mi];
html += '<button class="cand" data-mi="' + mi + '"><span class="num">' + M[0] + '</span>' +
'<div class="cname"><span class="dot" style="background:' + COLOR_DOT[M[1]] + '"></span>' + (M[1].endsWith('色')? esc(M[1]): esc(M[1]) + '色') + '</div>' +
'<div class="fname">模様：' + esc(M[2]) + '</div>' +
(med === 'stone'? '<div class="shape">' + esc(M[4]) + '</div>': '') + '</button>';
});
html += '</div></div>';
view.innerHTML = html;
Array.prototype.forEach.call(view.querySelectorAll('.cand'), function (el) {
el.onclick = function () {
var mi = parseInt(el.getAttribute('data-mi'), 10);
el.classList.add('picked');
document.getElementById('beam').classList.add('on');
sndPick();
setTimeout(function () {
day.choice = mi;
var firstMuse = !(LS.get('muse_track', { seen: false}).seen);
day.results = FG.generateAll(TODAY, profile, mi, Object.assign({}, used), museForce());
if (firstMuse && day.results.muse.rainbow) day.results.muse.sub += ' ／ はじめての方へ、特別な一枚です';
noteMuse(day.results.muse);
saveDay();
renderCards();
}, 650);
};
});
}

// ---------- 画面：カード一覧 ----------
function renderCards() {
if (!day.results) { renderTop(); return;}
var html = '<p class="date">' + TODAY.replace(/-/g, '/') + '</p><h2 class="title">今日のカード</h2><p class="lead">光っているカードは当たりの印。めくりたいものだけ、どうぞ。</p><div class="grid">';
day.setup.order.forEach(function (key) {
var r = day.results[key];
var flipped = day.flipped.indexOf(key) >= 0;
var sparkCls = r.spark === 'rainbow'? ' spark-rainbow': r.spark === 'gold'? ' spark-gold': '';
html += '<button class="fcard' + sparkCls + (flipped? ' flipped': '') + '" data-key="' + key + '"><span class="glow"></span><span class="inner">' +
'<span class="face back"><img src="' + A('back-' + key + '.webp') + '" alt=""><span class="info"><span class="type">' + esc(r.type) + '</span><span class="tap">タップでめくる</span></span></span>' +
'<span class="face front"><img src="' + A('front-' + key + '.webp') + '" alt=""><span class="info"><span class="type">' + esc(r.type) + '</span><span class="head' + (r.head.length >= 11? ' long': '') + '">' + esc(r.head) + '</span></span></span>' +
'</span></button>';
});
html += '</div>';
view.innerHTML = html;
Array.prototype.forEach.call(view.querySelectorAll('.fcard'), function (el) {
el.onclick = function () {
var key = el.getAttribute('data-key');
var r = day.results[key];
if (day.flipped.indexOf(key) < 0) {
day.flipped.push(key); pushHistory(key, r); commitIds(r); saveDay();
el.classList.add('flipped');
if (r.spark === 'rainbow') sndRainbow(); else if (r.spark === 'gold') sndGold(); else sndFlip();
} else {
renderDetail(r, 'cards');
}
};
});
}

// ---------- 画面：結果詳細 ----------
function sectionHtml(s) {
var inner = '';
if (s.tiles) {
inner = '<div class="tiles">' + s.tiles.map(function (t) { return '<div class="tile"><div class="k">' + esc(t[0]) + '</div><div class="v">' + esc(t[1]) + '</div></div>';}).join('') + '</div>';
} else if (s.pillars) {
inner = '<table class="ptable"><tr><th></th><th>干支</th><th>通変星</th></tr>' + s.pillars.map(function (p) { return '<tr><th>' + esc(p[0]) + '</th><td>' + esc(p[1]) + '</td><td>' + esc(p[2]) + '</td></tr>';}).join('') + '</table>';
} else if (s.bars) {
inner = '<div class="bars">' + s.bars.map(function (b) { return '<div class="bar"><span class="el">' + esc(b[0]) + '</span><span class="track"><span class="fill" style="width:' + (b[1] / 6 * 100) + '%"></span></span><span>' + b[1] + '</span></div>';}).join('') + '</div>';
} else {
inner = '<p>' + esc(s.t) + '</p>';
}
return '<section class="sect"><h3>' + esc(s.h) + '</h3>' + inner + '</section>';
}
function shareText(r) {
var lines = ['' + TODAY.replace(/-/g, '/'), r.type + '：' + r.head];
if (r.sub) lines.push(r.sub);
for (var i = 0; i < r.sections.length; i++) { if (r.sections[i].t) { lines.push(r.sections[i].t.split('\n')[0]); break;}}
return lines.join('\n');
}
function renderDetail(r, from) {
var html = '<div class="hero"><img src="' + A('front-' + r.key + '.webp') + '" alt=""' + heroStyle(r.key) + '><div class="shade"></div>' +
'<div class="hinfo"><span class="type">' + esc(r.type) + '</span><div class="head">' + esc(r.head) + '</div>' +
(r.sub? '<div class="sub">' + esc(r.sub) + '</div>': '') + '</div></div>';
html += '<div class="sections">' + r.sections.map(sectionHtml).join('') + '</div>';
html += '<div class="actions"><button class="ghost" id="shareText">テキストをコピー</button><button class="ghost" id="shareImg">結果を画像で保存</button></div>';
html += '<div class="backrow"><button class="ghost" id="backBtn">戻る</button></div>';
view.innerHTML = html;
document.getElementById('backBtn').onclick = function () { if (from === 'history') renderHistory(); else if (from === 'top') renderTop(); else renderCards();};
document.getElementById('shareText').onclick = function () {
var txt = shareText(r);
if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function () { toast('コピーしました');}, function () { toast('コピーできませんでした');});
else toast('コピーできませんでした');
};
document.getElementById('shareImg').onclick = function () { saveImage(r);};
}
function saveImage(r) {
var img = new Image();
img.onload = function () {
try {
var c = document.createElement('canvas'); c.width = 900; c.height = 1200;
var x = c.getContext('2d');
var scale = Math.max(900 / img.width, 1200 / img.height);
var w = img.width * scale, h = img.height * scale;
x.drawImage(img, (900 - w) / 2, (1200 - h) / 2, w, h);
var gr = x.createLinearGradient(0, 500, 0, 1200);
gr.addColorStop(0, 'rgba(5,4,20,0)'); gr.addColorStop(1, 'rgba(5,4,20,0.92)');
x.fillStyle = gr; x.fillRect(0, 0, 900, 1200);
x.textAlign = 'center'; x.fillStyle = '#ffe9a8';
x.font = '28px sans-serif'; x.fillText(r.type, 450, 880);
x.fillStyle = '#f6efdd'; x.font = 'bold 64px serif'; x.fillText(r.head, 450, 960);
x.font = '26px sans-serif'; x.fillStyle = '#b9b3d9';
x.fillText(TODAY.replace(/-/g, '/') + ' ／ ミューの今日の運勢ガチャ', 450, 1030);
c.toBlob(function (b) {
var a = document.createElement('a');
a.href = URL.createObjectURL(b);
a.download = 'fortune-' + TODAY.replace(/-/g, '') + '-' + r.key + '.png';
a.click(); setTimeout(function () { URL.revokeObjectURL(a.href);}, 3000);
toast('画像を保存しました');
}, 'image/png');
} catch (e) { toast('画像保存はこの環境では使えませんでした');}
};
img.onerror = function () { toast('画像を読み込めませんでした');};
img.src = A('front-' + r.key + '.webp');
}

// ---------- 画面：履歴 ----------
function renderHistory() {
var dates = Object.keys(history).sort().reverse();
var html = '<h2 class="title">履歴</h2><p class="lead">めくった結果だけが、ここに残ります。</p>';
if (!dates.length) html += '<div class="empty">まだ履歴がありません。</div>';
dates.forEach(function (d) {
html += '<div class="hrow"><span class="d">' + d.replace(/-/g, '/') + '</span><div class="hchips">';
for (var k in history[d]) {
html += '<button class="hchip" data-date="' + d + '" data-key="' + k + '">' + esc(history[d][k].type) + '：' + esc(history[d][k].head) + '</button>';
}
html += '</div></div>';
});
view.innerHTML = html;
Array.prototype.forEach.call(view.querySelectorAll('.hchip'), function (el) {
el.onclick = function () { renderDetail(history[el.getAttribute('data-date')][el.getAttribute('data-key')], 'history');};
});
}

// ---------- 画面：設定 ----------
function renderSettings() {
var p = profile;
var profHtml = p? (window.DATA_ZODIAC.signs[p.sign].name + ' ／ 命式 ' + FG.pillarName(p.pil.y) + '・' + FG.pillarName(p.pil.m) + '・' + FG.pillarName(p.pil.d) + '<br>血液型 ' + esc(p.blood || '未選択') + ' ／ ' + esc(p.gender || '未選択') + ' ／ ' + esc(p.ageBand)): '未登録';
var html = '<h2 class="title">設定</h2>' +
'<div class="setrow"><div>おまかせ一占モード<small>選択をすべて省略し、占いの種類も含めてランダムな1結果だけが届きます。今日の分が決まっている場合は明日から切り替わります。</small></div>' +
'<label class="switch"><input type="checkbox" id="swOmakase"' + (settings.omakase? ' checked': '') + '><span class="tr"></span></label></div>' +
'<div class="setrow"><div>効果音<small>選択やめくりの音（Web Audio合成）を鳴らします。</small></div>' +
'<label class="switch"><input type="checkbox" id="swSound"' + (settings.sound? ' checked': '') + '><span class="tr"></span></label></div>' +
'<div class="setrow"><div>占い用プロフィール<small>' + profHtml + '</small></div>' +
'<button class="ghost" id="reReg">登録し直す</button></div>' +
(p && p.setsuNote? '<p class="lead">※生まれた日が節入りの前後に当たるため、生まれた時刻によって月の干支が変わることがあります。</p>': '') + '<p class="lead" style="margin-top:14px">登録し直した場合、今日の結果が決まっているときは明日から反映されます。</p>';
view.innerHTML = html;
document.getElementById('swOmakase').onchange = function (e) { settings.omakase = e.target.checked; LS.set('settings', settings); toast(e.target.checked? 'おまかせ一占をオンにしました（明日から）': 'おまかせ一占をオフにしました');};
document.getElementById('swSound').onchange = function (e) { settings.sound = e.target.checked; LS.set('settings', settings);};
document.getElementById('reReg').onclick = openModal;
}

// ---------- プロフィール登録モーダル ----------
var modal = document.getElementById('modal');
function openModal() { modal.classList.remove('hidden');}
function closeModal() { modal.classList.add('hidden');}
document.getElementById('modalClose').onclick = closeModal;
document.getElementById('profileForm').addEventListener('submit', function (e) {
e.preventDefault();
var bv = document.getElementById('fBirth').value;
if (!bv) return;
var parts = bv.split('-').map(Number);
var np = FG.buildProfile(parts[0], parts[1], parts[2], document.getElementById('fBlood').value, document.getElementById('fGender').value);
closeModal();
if (day.choice!== null || day.omakase) {
LS.set('profile_next', np);
toast('登録しました。新しいプロフィールは明日から反映されます');
} else {
profile = np; LS.set('profile', profile);
day = { date: TODAY, sig: np.sig, setup: FG.daySetup(TODAY, np), choice: null, results: null, flipped: [], omakase: null};
maybeOmakase(); saveDay();
toast('登録しました');
}
renderTop();
});

document.getElementById('btnHistory').onclick = renderHistory;
document.getElementById('btnSettings').onclick = renderSettings;

// ---------- 星空 ----------
(function stars() {
var c = document.getElementById('stars'), x = c.getContext('2d'), pts = [];
function size() { c.width = innerWidth; c.height = innerHeight; pts = []; for (var i = 0; i < 110; i++) pts.push({ x: Math.random() * c.width, y: Math.random() * c.height, r: Math.random() * 1.3 + 0.3, p: Math.random() * 6.28});}
size(); addEventListener('resize', size);
(function loop(t) {
x.clearRect(0, 0, c.width, c.height);
pts.forEach(function (p) { x.globalAlpha = 0.35 + 0.3 * Math.sin(t / 900 + p.p); x.fillStyle = '#ffe9a8'; x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.29); x.fill();});
x.globalAlpha = 1;
requestAnimationFrame(loop);
})(0);
})();

setInterval(function () { if (todayStr()!== TODAY) location.reload();}, 60000);
renderTop();
if (!profile) openModal();
})();

</script>
</body>
</html>
