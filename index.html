<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ミューの今日の運勢ガチャ</title>
<meta name="description" content="1日1回、ミューが今日の運勢をお届けする小さなガチャアプリ。">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <header class="hero">
    <p class="stars" aria-hidden="true">★ ✦ ★</p>
    <h1>ミューの今日の運勢ガチャ</h1>
    <p class="lead">1日1回、ミューが今日の運勢をお届けします。</p>
    <img id="heroImg" class="hero-img" alt="手を振って迎えるミュー">
  </header>

  <section class="gacha" aria-live="polite">
    <button id="drawBtn" class="draw-btn" type="button">今日の運勢を引く</button>
    <p id="note" class="note"></p>

    <article id="card" class="card hidden">
      <img id="cardImg" class="card-img" alt="ミューのイラスト">
      <p id="rank" class="rank"></p>
      <p id="message" class="message"></p>
      <dl class="lucky">
        <div><dt>ラッキーアイテム</dt><dd id="luckyItem"></dd></div>
        <div><dt>ラッキーカラー</dt><dd id="luckyColor"></dd></div>
      </dl>
      <p id="advice" class="advice"></p>
      <button id="shareBtn" class="share-btn" type="button">結果をコピーしてシェア</button>
      <p id="copied" class="copied"></p>
    </article>
  </section>

  <footer class="foot">
    <p>運勢は日本時間の日付で決まります。日付が変わると、また引けます。</p>
  </footer>
</main>
<script src="fortunes.js"></script>
<script src="assets-wave.js"></script>
<script src="assets-desk.js"></script>
<script src="assets-full.js"></script>
<script src="app.js"></script>
</body>
</html>
